<h3 class="title">{{ capsule().title }}</h3>

<div class="paper-wrap">
	<div class="paper">
		<p class="letter">{{ capsule().message }}</p>
		<div class="foot">
			<span class="signature">{{ capsule().createdByUsername }}</span>
			@if (canDelete()) {
				<button type="button" class="delete" (click)="deleteRequested.emit()"
					[attr.aria-label]="'events.deleteButton' | translate" [title]="'events.deleteButton' | translate">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M3 6h18" />
						<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
						<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
					</svg>
				</button>
			}
		</div>
	</div>
</div>

<span class="meta">{{ 'capsules.openedLabel' | translate }} {{ openedOn() | localDate:'longDate' }}</span>
