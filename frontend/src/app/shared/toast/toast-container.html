<div class="toast-stack">
	@for (toast of toastService.toasts(); track toast.id) {
		<div class="toast" [class.toast-success]="toast.type === 'success'" [class.toast-error]="toast.type === 'error'">
			<span class="toast-icon">{{ toast.type === 'success' ? '✓' : '!' }}</span>
			<span class="toast-message">{{ toast.messageKey | translate }}</span>
			<button type="button" class="toast-close" (click)="toastService.dismiss(toast.id)" aria-label="Close">×</button>
		</div>
	}
</div>
