<div class="sky" role="group" [attr.aria-label]="'wishlist.skyLabel' | translate">
	@for (dot of dust; track $index) {
		<i class="dust" aria-hidden="true" [style.left.%]="dot.x" [style.top.%]="dot.y" [style.opacity]="dot.opacity"></i>
	}

	@for (star of stars(); track star.id) {
		<button type="button" class="star" [class.lit]="star.fulfilled" [class.selected]="star.id === selectedId()"
			[class.flash]="star.id === flashId()" [class.match]="star.match" [class.dim]="star.dim" [style.left.%]="star.x" [style.top.%]="star.y"
			[class.tip-start]="star.x < 25" [class.tip-end]="star.x > 75" [class.tip-below]="star.y < 22"
			[attr.aria-label]="star.title" [attr.aria-pressed]="star.id === selectedId()"
			(click)="selectWish.emit(star.id)">
			<span class="label" aria-hidden="true">{{ star.title }}</span>
			<span class="tip" aria-hidden="true">{{ star.title }}</span>
		</button>
	}

	@if (stars().length === 0) {
		<p class="sky-empty">{{ 'wishlist.empty' | translate }}</p>
	}
</div>
