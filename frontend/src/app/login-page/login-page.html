<div class="auth-page">
	<div class="auth-card card fade-in">
		<div class="brand">
			<span class="brand-mark">✦</span>
			<span class="brand-name gradient-text">OurSpace</span>
		</div>
		<h1>{{ 'auth.loginTitle' | translate }}</h1>
		<p class="subtitle">{{ 'auth.loginSubtitle' | translate }}</p>

		<form (submit)="login(); $event.preventDefault()">
			<div class="field">
				<label for="username">{{ 'auth.usernameLabel' | translate }}</label>
				<input id="username" type="text" autocomplete="username" [value]="loginData().username"
					(input)="updateField('username', $any($event.target).value)">
			</div>

			<div class="field">
				<label for="password">{{ 'auth.passwordLabel' | translate }}</label>
				<input id="password" type="password" autocomplete="current-password" [value]="loginData().password"
					(input)="updateField('password', $any($event.target).value)">
			</div>

			@if (errorKey()) {
				<div class="alert alert-error">{{ errorKey() | translate }}</div>
			}

			<button class="btn btn-primary" type="submit" style="width: 100%">{{ 'auth.loginButton' | translate }}</button>
		</form>

		<p class="switch-link">{{ 'auth.noAccount' | translate }} <a routerLink="/register">{{ 'auth.registerLink' | translate }}</a></p>
	</div>
</div>
