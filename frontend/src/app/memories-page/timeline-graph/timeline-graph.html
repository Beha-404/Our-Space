<div class="timeline-wrap">
	<svg [attr.viewBox]="'0 0 ' + width + ' ' + height" preserveAspectRatio="none" class="timeline-svg">
		<line x1="0" [attr.y1]="photoLaneY" [attr.x2]="width" [attr.y2]="photoLaneY" class="lane-line" />
		<line x1="0" [attr.y1]="audioLaneY" [attr.x2]="width" [attr.y2]="audioLaneY" class="lane-line" />

		<text x="4" [attr.y]="photoLaneY - 14" class="lane-label">{{ 'landing.featurePhotosTitle' | translate }}</text>
		<text x="4" [attr.y]="audioLaneY - 14" class="lane-label">{{ 'landing.featureAudioTitle' | translate }}</text>

		@for (item of items(); track item.id) {
			<circle
				[attr.cx]="xFor(item.date)"
				[attr.cy]="laneYFor(item)"
				r="7"
				class="dot"
				[class.dot-photo]="item.type === 'photo'"
				[class.dot-audio]="item.type === 'audio'"
				(mouseenter)="onHover(item, $event)"
				(mouseleave)="onLeave()">
			</circle>
		}
	</svg>

	@if (hoveredItem(); as item) {
		<div class="tooltip" [style.left.px]="hoverPos().x" [style.top.px]="hoverPos().y">
			@if (item.thumbnailUrl) {
				<img [src]="item.thumbnailUrl" alt="" class="tooltip-thumb">
			} @else {
				<div class="tooltip-audio-icon">🎧</div>
			}
			<p class="tooltip-caption">{{ item.caption || (item.type === 'photo' ? ('landing.featurePhotosTitle' | translate) : ('landing.featureAudioTitle' | translate)) }}</p>
			<p class="tooltip-date">{{ item.date | date:'longDate' }}</p>
		</div>
	}
</div>
